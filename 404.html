<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Nainne</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fbf1c7">
    <meta name="description" content="This page wandered off on a camping trip. Head back to camp.">
    <meta property="og:title" content="Page Not Found - Nainne">
    <!-- Root-relative paths: GitHub Pages serves this file for missing paths at any depth. -->
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <script>
        // Set the theme before first paint. Mirrors getAutoTheme() in assets/js/app.js.
        (function () {
            var mode = localStorage.getItem('theme') || 'auto';
            var hour = new Date().getHours();
            document.documentElement.setAttribute('data-theme',
                mode === 'auto' ? (hour >= 6 && hour < 18 ? 'day' : 'night') : mode);
        })();
    </script>
    <script src="/assets/js/app.js" defer></script>
    <link rel="preload" href="/assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <header class="page-header">
        <div class="clock-widget">
            <img src="/assets/img/logo.png" alt="">
            <span class="clock-time" id="clock">--:--</span>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme">☀</button>
        </div>
    </header>

    <div class="error-wrap">
        <div class="error-card">
            <p class="error-code">404</p>
            <h1 class="error-title">Lost in the woods 🏕️</h1>
            <p class="error-text">The page you're looking for wandered off on a camping trip.</p>
            <a class="back-link" href="/">Back to camp</a>
        </div>
    </div>

    <button class="corner-character nadeshiko" type="button" aria-controls="campPanel" aria-expanded="false" aria-label="Weather and nearby camp sites" data-tooltip="Camp check">
        <img src="/assets/img/nadeshiko.webp" alt="">
        <span class="nade-bubble" id="nadeBubble" role="status"></span>
    </button>

    <div class="camp-panel" id="campPanel" role="dialog" aria-label="Weather and nearby camp sites" hidden>
        <div class="camp-panel-head">
            <h2 class="camp-panel-title">Camp check</h2>
            <button class="camp-panel-close" type="button" aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6Z"/></svg>
            </button>
        </div>
        <div class="camp-panel-body" id="campPanelBody"></div>
    </div>
    <a class="corner-character rin" href="/gallery.html" aria-label="Photo gallery" data-tooltip="Open gallery">
        <img src="/assets/img/rin.webp" alt="">
    </a>
</body>
</html>
