<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Nainne</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fbf1c7">
    <meta name="description" content="This page wandered off on a camping trip. Head back to camp.">
    <meta property="og:title" content="Page Not Found - Nainne">
    <!-- Root-relative paths: GitHub Pages serves this file for missing paths at any depth. -->
    <link rel="icon" type="image/png" href="/assets/img/logo.png">
    <script>
        // Set the theme before first paint. Mirrors getAutoTheme() in assets/js/app.js.
        (function () {
            var mode = localStorage.getItem('theme') || 'auto';
            var hour = new Date().getHours();
            document.documentElement.setAttribute('data-theme',
                mode === 'auto' ? (hour >= 6 && hour < 18 ? 'day' : 'night') : mode);
        })();
    </script>
    <script src="/assets/js/app.js" defer></script>
    <link rel="preload" href="/assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        .error-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            z-index: 1;
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: 0 8px 32px var(--shadow-soft);
            padding: 48px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .error-code {
            font-size: 88px;
            font-weight: 700;
            color: var(--button-warm);
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-dark);
            margin: 16px 0 8px;
        }
        .error-text {
            font-size: 15px;
            color: var(--text-medium);
            margin: 0 0 28px;
            line-height: 1.6;
        }
        .back-link {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 999px;
            background: var(--button-warm);
            color: var(--button-text);
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .back-link:hover {
            background: var(--button-warm-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="error-card">
            <p class="error-code">404</p>
            <h1 class="error-title">Lost in the woods 🏕️</h1>
            <p class="error-text">The page you're looking for wandered off on a camping trip.</p>
            <a class="back-link" href="/">Back to camp</a>
        </div>
    </div>
</body>
</html>
