<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Nainne</title>
    <meta name="description" content="Nainne's photo gallery - captured moments from the journey.">
    <meta property="og:title" content="Gallery - Nainne">
    <meta property="og:description" content="Nainne's photo gallery - captured moments from the journey.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kabosuneko.github.io/gallery.html">
    <meta property="og:image" content="https://kabosuneko.github.io/assets/img/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gallery - Nainne">
    <meta name="twitter:description" content="Nainne's photo gallery - captured moments from the journey.">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'auto';
            var resolved = (theme === 'day' || theme === 'night') ? theme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
            document.documentElement.setAttribute('data-theme', resolved);
        })();
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/gallery.css">
</head>

<body>
    <header class="page-header">
        <div class="clock-widget">
            <img src="assets/img/logo.png" alt="logo">
            <span class="clock-time" id="clock">--:--</span>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">☀</button>
        </div>
    </header>
    <div class="gallery-container">
        <header class="gallery-header">
            <a href="index.html" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="1em" height="1em" fill="currentColor" aria-hidden="true">
                    <path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 256 214.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg>
                Back home
            </a>
            <h1 class="gallery-title">Photo Gallery</h1>
            <p class="gallery-subtitle">Captured moments from the journey 🏔️</p>
        </header>

        <main class="gallery-grid" id="galleryGrid">
            <div class="gallery-placeholder">
                <p>Add your photos to the <code>assets/gallery/</code> folder</p>
                <p>as <code>.webp</code> files and they'll show up automatically.</p>
            </div>
        </main>

        <footer class="gallery-footer">
            <p>© Nainne</p>
        </footer>
    </div>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" onclick="closeLightbox()">
        <button class="lightbox-close" aria-label="Close photo viewer" onclick="closeLightbox(event)">&times;</button>
        <button class="lightbox-nav lightbox-prev" aria-label="Previous photo" onclick="changeImage(-1, event)">&#10094;</button>
        <img src="" alt="Gallery image" class="lightbox-img" id="lightboxImg">
        <button class="lightbox-nav lightbox-next" aria-label="Next photo" onclick="changeImage(1, event)">&#10095;</button>
        <div class="lightbox-caption" id="lightboxCaption" aria-live="polite"></div>
    </div>

    <div id="copyToast" class="copy-toast" style="display: none;">copied to clipboard</div>

    <div class="corner-character nadeshiko" tabindex="0" role="button" aria-label="Say hi to Nadeshiko" data-tooltip="🍡 Say hi">
        <img src="assets/img/nadeshiko.png" alt="Nadeshiko - click to say hi">
        <div class="nade-bubble" id="nadeBubble"></div>
    </div>
    <div class="corner-character rin" tabindex="0" role="button" aria-label="Photo gallery" data-tooltip="📷 Back to top">
        <img src="assets/img/rin.png" alt="Rin - click to go back to top">
    </div>

    <script src="assets/js/gallery.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
